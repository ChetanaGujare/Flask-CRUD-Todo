<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flask CRUD Todo</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ============================================
           RESET & BASE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f0f2f8;
            --bg-card: rgba(255, 255, 255, 0.72);
            --bg-glass: rgba(255, 255, 255, 0.50);
            --border-glass: rgba(255, 255, 255, 0.60);
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.06);
            --text-primary: #0f0f1a;
            --text-secondary: #4a4a6a;
            --text-muted: #8a8aa8;
            --gradient-1: linear-gradient(135deg, #7c3aed, #4f46e5);
            --gradient-2: linear-gradient(135deg, #4f46e5, #06b6d4);
            --gradient-3: linear-gradient(135deg, #7c3aed, #ec4899);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 9999px;
            --transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #080816;
            --bg-card: rgba(18, 18, 40, 0.80);
            --bg-glass: rgba(18, 18, 40, 0.50);
            --border-glass: rgba(255, 255, 255, 0.08);
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.4);
            --text-primary: #e8ecf4;
            --text-secondary: #9aa5b5;
            --text-muted: #6b7a8f;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px;
            transition: background 0.5s ease, color 0.5s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* ============================================
           FLOATING BACKGROUND SHAPES
           ============================================ */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.30;
            animation: floatShape 20s ease-in-out infinite alternate;
        }
        .shape-1 {
            width: 500px; height: 500px;
            top: -150px; right: -100px;
            background: radial-gradient(circle, #7c3aed, #4f46e5);
        }
        .shape-2 {
            width: 400px; height: 400px;
            bottom: -100px; left: -80px;
            background: radial-gradient(circle, #06b6d4, #4f46e5);
            animation-delay: 3s;
        }
        .shape-3 {
            width: 300px; height: 300px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #ec4899, #7c3aed);
            animation-delay: 6s;
            opacity: 0.15;
        }
        .shape-4 {
            width: 350px; height: 350px;
            bottom: 20%; right: 20%;
            background: radial-gradient(circle, #f59e0b, #7c3aed);
            animation-delay: 9s;
        }
        @keyframes floatShape {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(10px, -10px) scale(1.05); }
        }
        [data-theme="dark"] .shape { opacity: 0.15; }

        /* ============================================
           GLASS UTILITY
           ============================================ */
        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-glass);
        }

        /* ============================================
           APP CONTAINER
           ============================================ */
        .app-container {
            max-width: 860px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .date-badge {
            padding: 10px 20px;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-glass);
        }
        .theme-toggle {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-full);
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-secondary);
            font-size: 18px;
        }
        .theme-toggle:hover {
            background: var(--gradient-1);
            color: #fff;
            border-color: transparent;
        }

        /* ============================================
           FOCUS CARD
           ============================================ */
        .focus-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 22px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-glass);
            margin-bottom: 24px;
            transition: all var(--transition);
        }
        .focus-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.08);
        }
        .focus-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .focus-icon {
            width: 52px; height: 52px;
            background: var(--gradient-1);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            box-shadow: 0 8px 24px rgba(79,70,229,0.25);
        }
        .focus-text h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .focus-text h2 {
            font-size: 20px;
            font-weight: 700;
        }
        .focus-meta {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .focus-meta i { color: #4f46e5; }
        .focus-progress {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .progress-ring {
            position: relative;
            width: 70px; height: 70px;
        }
        .progress-ring svg { transform: rotate(-90deg); }
        .progress-ring circle {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.6s ease;
        }
        .progress-ring .bg { stroke: var(--border-glass); }
        .progress-ring .fg { stroke: url(#grad); }
        .progress-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: 800;
        }
        .focus-badge {
            background: var(--gradient-1);
            color: #fff;
            padding: 6px 18px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
        }

        /* ============================================
           TABS
           ============================================ */
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glass);
            margin-bottom: 20px;
            width: fit-content;
            box-shadow: var(--shadow-glass);
        }
        .tabs button {
            background: transparent;
            border: none;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .tabs button.active {
            background: var(--gradient-1);
            color: #fff;
            box-shadow: 0 4px 12px rgba(79,70,229,0.25);
        }
        .tabs button:hover:not(.active) {
            color: var(--text-primary);
            background: rgba(255,255,255,0.1);
        }

        /* ============================================
           TASK SECTION
           ============================================ */
        .task-section {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 28px 30px;
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-glass);
        }
        .task-section .title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .task-section .title i { color: #4f46e5; }

        /* Add row */
        .add-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .add-row input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid var(--border-glass);
            border-radius: var(--radius-sm);
            font-size: 15px;
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            transition: border 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .add-row input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79,70,229,0.1);
        }
        .add-row button {
            background: var(--gradient-1);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .add-row button:hover { transform: scale(1.02); box-shadow: 0 8px 24px rgba(79,70,229,0.3); }

        /* Task list */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 420px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .task-list::-webkit-scrollbar { width: 4px; }
        .task-list::-webkit-scrollbar-thumb { background: var(--border-glass); border-radius: var(--radius-full); }

        .task-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            transition: all var(--transition);
        }
        .task-item:hover {
            background: var(--bg-card);
            border-color: var(--border-glass);
            box-shadow: var(--shadow-glass);
        }
        .task-item .check {
            width: 22px; height: 22px;
            border: 2px solid var(--border-glass);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            color: transparent;
            flex-shrink: 0;
            background: var(--bg-card);
        }
        .task-item .check.done {
            background: var(--gradient-1);
            border-color: #4f46e5;
            color: #fff;
            box-shadow: 0 4px 12px rgba(79,70,229,0.3);
        }
        .task-item .info { flex: 1; min-width: 0; }
        .task-item .info .title {
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .task-item .info .title.completed {
            color: var(--text-muted);
            text-decoration: line-through;
        }
        .task-item .info .badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: var(--radius-full);
        }
        .badge.done { background: #d1fae5; color: #065f46; }
        .badge.pending { background: #fef3c7; color: #92400e; }
        .task-item .delete {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: 0.2s;
            opacity: 0.3;
        }
        .task-item:hover .delete { opacity: 0.7; }
        .task-item .delete:hover { opacity: 1; color: #ef4444; background: #fee2e2; }

        .empty {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
        }
        .empty i { font-size: 40px; display: block; margin-bottom: 12px; }

        /* Stats */
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-glass);
        }
        .stats .left {
            display: flex;
            gap: 28px;
        }
        .stats .stat {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .stats .stat .num {
            font-size: 20px;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stats .stat .label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .stats .clear {
            background: transparent;
            border: 1px solid var(--border-glass);
            padding: 6px 20px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .stats .clear:hover {
            border-color: #ef4444;
            color: #ef4444;
            background: #fef2f2;
        }

        /* Progress bar */
        .progress-bar {
            margin-top: 16px;
            width: 100%;
            height: 4px;
            background: var(--border-glass);
            border-radius: var(--radius-full);
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: var(--gradient-1);
            border-radius: var(--radius-full);
            transition: width 0.4s ease;
            width: 0%;
        }

        /* Review button */
        .review-btn {
            margin-top: 20px;
            padding: 14px 36px;
            background: #1f2937;
            color: #fff;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            float: right;
            font-family: 'Inter', sans-serif;
        }
        .review-btn:hover {
            background: #374151;
            transform: translateY(-2px);
        }
        .review-btn .badge {
            background: rgba(255,255,255,0.15);
            padding: 2px 12px;
            border-radius: var(--radius-full);
            font-size: 12px;
        }

        /* Footer */
        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-glass);
            padding-top: 20px;
        }
        .footer i { color: #ec4899; }

        /* Responsive */
        @media (max-width: 640px) {
            body { padding: 16px; }
            .header { flex-direction: column; align-items: stretch; }
            .focus-card { flex-direction: column; align-items: stretch; }
            .focus-progress { justify-content: space-between; }
            .tabs { width: 100%; justify-content: stretch; }
            .tabs button { flex: 1; justify-content: center; padding: 8px 12px; font-size: 13px; }
            .task-section { padding: 20px 16px; }
            .add-row { flex-direction: column; }
            .add-row button { justify-content: center; }
            .stats { flex-direction: column; align-items: stretch; }
            .stats .left { justify-content: space-around; }
            .review-btn { float: none; width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Background Shapes -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
    </div>

    <div class="app-container">

        <!-- Header -->
        <header class="header">
            <div>
                <h1>📋 Learning Schedule</h1>
                <p class="sub"><i class="fas fa-calendar-check"></i> Stay on track · Day 8</p>
            </div>
            <div class="header-actions">
                <div class="date-badge" id="dateDisplay">
                    <i class="far fa-calendar-alt"></i>
                    <span></span>
                </div>
                <div class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </div>
            </div>
        </header>

        <!-- Focus Card -->
        <section class="focus-card">
            <div class="focus-left">
                <div class="focus-icon"><i class="fas fa-bullseye"></i></div>
                <div class="focus-text">
                    <h3>Today's Focus</h3>
                    <h2>Client-Side Todo List App</h2>
                    <div class="focus-meta">
                        <span><i class="far fa-calendar-check"></i> Day 8</span>
                        <span><i class="far fa-clock"></i> <span id="focusPending">6</span> tasks remaining</span>
                    </div>
                </div>
            </div>
            <div class="focus-progress">
                <div class="progress-ring">
                    <svg width="70" height="70" viewBox="0 0 70 70">
                        <defs>
                            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#7c3aed" />
                                <stop offset="100%" stop-color="#4f46e5" />
                            </linearGradient>
                        </defs>
                        <circle class="bg" cx="35" cy="35" r="28" stroke="var(--border-glass)" stroke-width="6" fill="none" />
                        <circle class="fg" cx="35" cy="35" r="28" stroke="url(#grad)" stroke-width="6"
                                stroke-linecap="round"
                                stroke-dasharray="175.93"
                                stroke-dashoffset="175.93"
                                id="progressRing" />
                    </svg>
                    <span class="progress-text" id="progressPercent">0%</span>
                </div>
                <span class="focus-badge" id="focusBadge"><i class="fas fa-arrow-right"></i> 6 remaining</span>
            </div>
        </section>

        <!-- Tabs -->
        <div class="tabs">
            <button class="active" id="tabAll"><i class="fas fa-list-ul"></i> All</button>
            <button id="tabPending"><i class="far fa-clock"></i> Pending</button>
            <button id="tabDone"><i class="fas fa-check-circle"></i> Done</button>
        </div>

        <!-- Task Section -->
        <section class="task-section">
            <div class="title"><i class="fas fa-tasks"></i> Task Implementation Steps</div>

            <div class="add-row">
                <input type="text" id="taskInput" placeholder="Add a new task…" autocomplete="off" />
                <button id="addBtn"><i class="fas fa-plus"></i> Add</button>
            </div>

            <div class="task-list" id="taskList"></div>

            <div class="stats">
                <div class="left">
                    <div class="stat"><span class="num" id="totalCount">0</span><span class="label">Total</span></div>
                    <div class="stat"><span class="num" id="doneCount">0</span><span class="label">Done</span></div>
                    <div class="stat"><span class="num" id="pendingCount">0</span><span class="label">Pending</span></div>
                </div>
                <button class="clear" id="clearBtn"><i class="fas fa-trash-alt"></i> Clear All</button>
            </div>

            <div class="progress-bar">
                <div class="fill" id="progressFill" style="width:0%;"></div>
            </div>

            <button class="review-btn" id="reviewBtn">
                <i class="fas fa-thumbs-up"></i> I've Reviewed the Steps
                <span class="badge" id="reviewBadge">0/0</span>
            </button>
        </section>

        <div class="footer">
            &copy; 2026 — Made with <i class="fas fa-heart"></i> by Chetana Gujare · Flask API
        </div>
    </div>

    <script>
        // ============================================
        // MAIN JAVASCRIPT — CRUD with Flask API
        // ============================================
        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const taskList = document.getElementById('taskList');
            const taskInput = document.getElementById('taskInput');
            const addBtn = document.getElementById('addBtn');
            const clearBtn = document.getElementById('clearBtn');
            const reviewBtn = document.getElementById('reviewBtn');
            const totalCount = document.getElementById('totalCount');
            const doneCount = document.getElementById('doneCount');
            const pendingCount = document.getElementById('pendingCount');
            const progressFill = document.getElementById('progressFill');
            const progressPercent = document.getElementById('progressPercent');
            const progressRing = document.getElementById('progressRing');
            const focusPending = document.getElementById('focusPending');
            const focusBadge = document.getElementById('focusBadge');
            const reviewBadge = document.getElementById('reviewBadge');
            const dateDisplay = document.querySelector('#dateDisplay span');
            const themeToggle = document.getElementById('themeToggle');

            const API_BASE = 'http://localhost:5000/api';

            // ---------- State ----------
            let tasks = [];
            let currentFilter = 'all';
            const circumference = 2 * Math.PI * 28;

            // ---------- Utilities ----------
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function formatDate(d) {
                return new Date(d).toLocaleDateString('en-US', {
                    weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
                });
            }

            // ---------- Theme ----------
            function loadTheme() {
                const saved = localStorage.getItem('theme');
                if (saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
                }
            }

            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme');
                if (current === 'dark') {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                    themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                    themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
                }
            }

            // ---------- API Calls ----------
            async function fetchTodos() {
                try {
                    const res = await fetch(`${API_BASE}/todos`);
                    const json = await res.json();
                    if (json.success) {
                        tasks = json.data.map(t => ({
                            id: t.id,
                            title: t.title,
                            description: t.description || '',
                            completed: t.completed === 1,
                            created_at: t.created_at
                        }));
                        render();
                    } else {
                        alert('API Error: ' + json.error);
                    }
                } catch (err) {
                    console.error(err);
                    alert('Cannot connect to Flask server. Make sure it is running on port 5000.');
                }
            }

            async function addTask(title) {
                try {
                    const res = await fetch(`${API_BASE}/todos`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, description: '', completed: false })
                    });
                    const json = await res.json();
                    if (json.success) {
                        await fetchTodos();
                    } else {
                        alert('Error: ' + json.error);
                    }
                } catch (err) {
                    alert('Network error: ' + err.message);
                }
            }

            async function toggleTask(id) {
                const task = tasks.find(t => t.id === id);
                if (!task) return;
                const newCompleted = !task.completed;
                try {
                    const res = await fetch(`${API_BASE}/todos/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ completed: newCompleted })
                    });
                    const json = await res.json();
                    if (json.success) {
                        await fetchTodos();
                    } else {
                        alert('Error: ' + json.error);
                    }
                } catch (err) {
                    alert('Network error: ' + err.message);
                }
            }

            async function deleteTask(id) {
                if (!confirm('Delete this task?')) return;
                try {
                    const res = await fetch(`${API_BASE}/todos/${id}`, { method: 'DELETE' });
                    const json = await res.json();
                    if (json.success) {
                        await fetchTodos();
                    } else {
                        alert('Error: ' + json.error);
                    }
                } catch (err) {
                    alert('Network error: ' + err.message);
                }
            }

            async function clearAllTasks() {
                if (tasks.length === 0) return;
                if (!confirm('Delete ALL tasks?')) return;
                for (const t of tasks) {
                    await fetch(`${API_BASE}/todos/${t.id}`, { method: 'DELETE' });
                }
                await fetchTodos();
            }

            // ---------- Render ----------
            function render() {
                let filtered = tasks;
                if (currentFilter === 'done') filtered = tasks.filter(t => t.completed);
                else if (currentFilter === 'pending') filtered = tasks.filter(t => !t.completed);

                const sorted = [...filtered].sort((a, b) => a.completed === b.completed ? 0 : a.completed ? 1 : -1);

                if (sorted.length === 0) {
                    const msg = currentFilter === 'done' ? 'No completed tasks yet.' :
                                currentFilter === 'pending' ? 'All tasks are completed! 🎉' :
                                'No tasks yet — add one above!';
                    taskList.innerHTML = `
                        <div class="empty">
                            <i class="far fa-smile"></i>
                            <p>${msg}</p>
                        </div>
                    `;
                } else {
                    let html = '';
                    sorted.forEach(task => {
                        const checked = task.completed ? 'done' : '';
                        const titleClass = task.completed ? 'completed' : '';
                        const badgeClass = task.completed ? 'done' : 'pending';
                        const badgeText = task.completed ? 'Done' : 'In Progress';
                        html += `
                            <div class="task-item" data-id="${task.id}">
                                <div class="check ${checked}" data-id="${task.id}">
                                    ${task.completed ? '<i class="fas fa-check"></i>' : ''}
                                </div>
                                <div class="info">
                                    <div class="title ${titleClass}">
                                        ${escapeHtml(task.title)}
                                        <span class="badge ${badgeClass}">${badgeText}</span>
                                    </div>
                                    ${task.description ? `<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${escapeHtml(task.description)}</div>` : ''}
                                </div>
                                <button class="delete" data-id="${task.id}" title="Delete"><i class="fas fa-times"></i></button>
                            </div>
                        `;
                    });
                    taskList.innerHTML = html;
                }

                // Update stats
                const total = tasks.length;
                const done = tasks.filter(t => t.completed).length;
                const pending = total - done;
                const pct = total === 0 ? 0 : Math.round((done / total) * 100);

                totalCount.textContent = total;
                doneCount.textContent = done;
                pendingCount.textContent = pending;
                progressFill.style.width = pct + '%';
                progressPercent.textContent = pct + '%';
                focusPending.textContent = pending;
                focusBadge.innerHTML = `<i class="fas fa-arrow-right"></i> ${pending} remaining`;
                reviewBadge.textContent = `${done}/${total}`;

                // Progress ring
                const offset = circumference - (pct / 100) * circumference;
                progressRing.style.strokeDashoffset = offset;
            }

            // ---------- Event Listeners ----------

            // Add task
            addBtn.addEventListener('click', async () => {
                const val = taskInput.value.trim();
                if (!val) {
                    taskInput.style.borderColor = '#ef4444';
                    setTimeout(() => taskInput.style.borderColor = '', 400);
                    return;
                }
                await addTask(val);
                taskInput.value = '';
                taskInput.focus();
            });
            taskInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') addBtn.click();
            });

            // Task list clicks (check, delete, title)
            taskList.addEventListener('click', (e) => {
                const check = e.target.closest('.check');
                if (check) {
                    const id = parseInt(check.dataset.id);
                    if (id) toggleTask(id);
                    return;
                }
                const del = e.target.closest('.delete');
                if (del) {
                    const id = parseInt(del.dataset.id);
                    if (id) deleteTask(id);
                    return;
                }
                const titleEl = e.target.closest('.title');
                if (titleEl) {
                    const item = titleEl.closest('.task-item');
                    if (item) {
                        const id = parseInt(item.dataset.id);
                        if (id) toggleTask(id);
                    }
                }
            });

            // Clear all
            clearBtn.addEventListener('click', clearAllTasks);

            // Review button
            reviewBtn.addEventListener('click', () => {
                const done = tasks.filter(t => t.completed).length;
                const total = tasks.length;
                if (total === 0) alert('📝 No tasks yet. Add some to get started!');
                else if (done === total) alert('🎉 Amazing! You\'ve completed all tasks!');
                else alert(`📊 You've completed ${done} out of ${total} tasks. Keep going! 💪`);
            });

            // Tabs
            document.querySelectorAll('.tabs button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const id = this.id;
                    if (id === 'tabAll') currentFilter = 'all';
                    else if (id === 'tabPending') currentFilter = 'pending';
                    else if (id === 'tabDone') currentFilter = 'done';
                    render();
                });
            });

            // Theme
            themeToggle.addEventListener('click', toggleTheme);

            // Date
            function setDate() {
                const now = new Date();
                dateDisplay.textContent = formatDate(now);
            }

            // ---------- Init ----------
            loadTheme();
            setDate();
            fetchTodos();
            taskInput.focus();
        })();
    </script>
</body>
</html>
